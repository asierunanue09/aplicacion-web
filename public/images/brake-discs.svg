<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="rotor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <ellipse cx="200" cy="340" rx="135" ry="18" fill="#020617" opacity="0.8"/>
  <!-- Second Disc (behind) -->
  <g transform="translate(-32, -16)">
    <circle cx="200" cy="200" r="122" fill="#64748b" stroke="#334155" stroke-width="5"/>
    <circle cx="200" cy="200" r="64" fill="#1e293b"/>
    <circle cx="200" cy="200" r="24" fill="#0f172a"/>
  </g>
  <!-- Primary Ventilated Disc -->
  <g transform="translate(26, 16)">
    <circle cx="200" cy="200" r="126" fill="url(#rotor)" stroke="#475569" stroke-width="4"/>
    <circle cx="200" cy="200" r="118" fill="none" stroke="#64748b" stroke-width="1" opacity="0.5"/>
    <circle cx="200" cy="200" r="95" fill="none" stroke="#64748b" stroke-width="1" opacity="0.4"/>
    <circle cx="200" cy="200" r="64" fill="url(#hub)" stroke="#64748b" stroke-width="3"/>
    <circle cx="200" cy="200" r="26" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- 5x112 bolt holes -->
    <circle cx="200" cy="154" r="6.5" fill="#0f172a"/>
    <circle cx="244" cy="186" r="6.5" fill="#0f172a"/>
    <circle cx="227" cy="237" r="6.5" fill="#0f172a"/>
    <circle cx="173" cy="237" r="6.5" fill="#0f172a"/>
    <circle cx="156" cy="186" r="6.5" fill="#0f172a"/>
  </g>
</svg>
